title: CS & Software Engineering Knowledge Base
description: A comprehensive, structured resource for learning Computer Science, Software Engineering, Competitive Programming, and Technical Interview Preparation.
remote_theme: just-the-docs/just-the-docs
color_scheme: dark

# Site URL (project site)
url: "https://shubhu-io.github.io"
baseurl: "/Dsa-knowledge-base"

# Files/folders that should NOT be part of the built site
exclude:
  - wiki
  - .vscode
  - .git
  - .gitignore
  - "*.sh"
  - ".GITHUB_UPLOAD_STEPS.md"
  - ".HOW_TO_MAKE_BEAUTIFUL_WEBSITE.md"
  - "assets/README.md"
  - "README.md"
  - "SUMMARY.md"
  - "CONTRIBUTING.md"
  - "AGENTS.md"
  - "LICENSE"

# README.md files render as their folder's section page
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Search
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  rel_url: true
  button: false
  focus_shortcut_key: 'k'

# Navigation
nav_enabled: true
heading_anchors: true

# Auxiliary links (top-right)
aux_links:
  "GitHub":
    - "https://github.com/shubhu-io/Dsa-knowledge-base"
  "Wiki":
    - "https://github.com/shubhu-io/Dsa-knowledge-base/wiki"
aux_links_new_tab: true

# "Edit this page on GitHub" links
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/shubhu-io/Dsa-knowledge-base"
gh_edit_branch: "main"
gh_edit_source: ""
gh_edit_view_mode: "edit"

# Code copy button (enabled by default; explicit for clarity)
enable_copy_code_button: true
